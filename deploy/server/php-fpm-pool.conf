; The signage panel's PHP workers (deploy/README.md). They run as the deploy account, which owns the code and
; the storage, so an upload is written with no permission juggling; Nginx reaches them through the socket.
[signage]
user = deploy
group = deploy
listen = /run/php/signage.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for 4 GB of RAM (Hetzner CPX22) with MySQL on the same server: a request takes about 50 MB, and
; twelve at once is far more than a few hundred screens asking three times a minute need.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; A request stuck longer than a 250 MB upload could take is ended rather than holding a worker.
request_terminate_timeout = 300
catch_workers_output = yes
