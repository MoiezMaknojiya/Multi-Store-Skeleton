; The signage panel's PHP workers (deploy/README.md). They run as the deploy account, which owns the code and
; the storage, so an upload is written with no permission juggling; Nginx reaches them through the socket.
[signage]
user = deploy
group = deploy
listen = /run/php/signage.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for 2 GB of RAM and one core (Hetzner CPX12) with MySQL on the same server: a request takes about
; 50 MB, and six at once still answers a few hundred screens asking three times a minute. Raise max_children
; with the plan — about one worker per 100 MB of RAM left over once MySQL has its cache.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; A request stuck longer than a 250 MB upload could take is ended rather than holding a worker.
request_terminate_timeout = 300
catch_workers_output = yes
