; The signage panel's PHP settings (deploy/README.md), for PHP-FPM and the command line alike.

; A media upload reaches 250 MB (StoreMediaRequest::MAX_KILOBYTES), and a large picture's thumbnail is drawn
; with GD in memory: a ceiling for the rare big one, not what a request normally uses.
upload_max_filesize = 260M
post_max_size = 270M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
expose_php = Off

; OPcache: the code only changes with a deploy, and deploy/deploy.sh reloads PHP each time.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
