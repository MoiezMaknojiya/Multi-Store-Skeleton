# The signage panel's site (deploy/README.md). setup.sh writes it to /etc/nginx/sites-available/signage with
# the domain filled in; `certbot --nginx` then adds HTTPS to it and sends plain HTTP there.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/signage/current/public;
    index index.php;
    charset utf-8;

    # A media upload reaches 250 MB (php.ini lets 260 MB through).
    client_max_body_size 260m;
    client_body_timeout 300s;

    include snippets/cloudflare-realip.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite names every built file after its content, so a browser may keep it for a year.
    location /build/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # A published Ad Builder page is rewritten in place on every publish (its address carries ?v=, and the
    # browser asks again each time). Opened on its own it runs sandboxed — an origin of its own, exactly like
    # the television's frame — so nothing on it can reach the panel.
    location ~ ^/storage/builder/.+\.html$ {
        add_header Content-Security-Policy "sandbox allow-scripts" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Pictures and videos keep their name for the life of the file (a poster redrawn in place carries ?v=).
    location ~* ^/storage/.+\.(?:jpe?g|png|gif|webp|mp4|webm)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/signage.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
